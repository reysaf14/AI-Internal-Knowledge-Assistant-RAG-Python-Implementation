services:
  rag-assistant:
    image: ${RAG_IMAGE:-rag-assistant:local}
    init: true
    working_dir: /app
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_ENV: container
      DOCS_PATH: docs
      INDEX_PATH: .runtime/index.sqlite3
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-30}
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-4}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      RAG_CONTEXT_LIMIT: ${RAG_CONTEXT_LIMIT:-5}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - rag_runtime:/app/.runtime
    command: ["bot"]

volumes:
  rag_runtime:
