[project]
name = "rag-assistant"
version = "0.1.0"
description = "AI Internal Knowledge Assistant (RAG) - Toko Makmur Jaya"
requires-python = "==3.12.*"
dependencies = [
    "python-telegram-bot>=22.8,<23",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
